    <meta name="description" content="Talha Akram — MERN Stack Developer building modern, responsive, and scalable web applications." />
    <title>Talha Akram — MERN Stack Developer</title>
    <script>
      // Runs before first paint to avoid a light/dark flash on load.
      // Priority: saved preference -> system preference -> dark (site default).
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
